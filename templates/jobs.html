{% extends "base.html" %}

{% block title %}My Jobs - Contract Extraction{% endblock %}

{% block content %}
<h1>My Extraction Jobs</h1>

<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <input type="text" id="search-box" placeholder="Search jobs..." style="flex: 1; margin-right: 10px;">
        <button onclick="loadJobs()" class="btn">🔄 Refresh</button>
        <a href="/upload" class="btn" style="text-decoration: none; margin-left: 10px;">📤 New Job</a>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="select-all-checkbox" onchange="selectAllJobs()" style="cursor: pointer; width: 18px; height: 18px;">
            <label for="select-all-checkbox" style="cursor: pointer; margin: 0;">Select All</label>
            <span id="selection-count" style="color: #666; font-size: 14px; margin-left: 10px;">(0 selected)</span>
        </div>
        <button id="delete-button" onclick="deleteSelectedJobs()" class="btn" style="background-color: #dc3545; display: none;">🗑️ Delete Selected</button>
    </div>

    <div id="jobs-container">
        <div class="loading" style="display: block;">
            <div class="spinner"></div>
            <p>Loading jobs...</p>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <button onclick="previousPage()" class="btn btn-secondary">← Previous</button>
        <span id="page-info" style="margin: 0 20px;">Page 1</span>
        <button onclick="nextPage()" class="btn btn-secondary">Next →</button>
    </div>
</div>

<!-- Job Detail Modal -->
<div id="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 600px; max-height: 80vh; overflow-y: auto;">
        <button onclick="closeModal()" style="float: right; background: none; border: none; font-size: 20px; cursor: pointer;">×</button>
        <div id="modal-content"></div>
    </div>
</div>

<script>
    let currentPage = 1;
    const itemsPerPage = 20;

    async function loadJobs() {
        const response = await apiCall(`/jobs?page=${currentPage}&per_page=${itemsPerPage}`);

        if (response.status === 200) {
            const jobs = response.data.jobs;
            const total = response.data.total;
            const pages = response.data.pages;

            const container = document.getElementById('jobs-container');

            if (jobs.length === 0) {
                container.innerHTML = '<p style="color: #999; text-align: center; padding: 40px;">No jobs found. <a href="/upload">Upload contracts</a> to get started.</p>';
            } else {
                let html = '<table><thead><tr><th style="width: 40px;"></th><th>Job Name</th><th>Status</th><th>Files</th><th>Contracts</th><th>Created</th><th>Action</th></tr></thead><tbody>';

                jobs.forEach(job => {
                    const statusBadge = `<span class="badge badge-${
                        job.status === 'completed' ? 'success' :
                        job.status === 'processing' ? 'warning' :
                        job.status === 'failed' ? 'danger' : 'info'
                    }">${job.status}</span>`;

                    const createdDate = new Date(job.created_at).toLocaleDateString();

                    html += `
                        <tr>
                            <td><input type="checkbox" class="job-checkbox" value="${job.id}" onchange="updateDeleteUI()" style="cursor: pointer; width: 18px; height: 18px;"></td>
                            <td><strong>${job.job_name}</strong></td>
                            <td>${statusBadge}</td>
                            <td>${job.input_file_count}</td>
                            <td>${job.total_contracts_extracted}</td>
                            <td>${createdDate}</td>
                            <td>
                                <button onclick="viewJobDetails('${job.id}')" style="background: none; border: none; color: #667eea; cursor: pointer; text-decoration: underline;">View</button>
                                ${job.status === 'completed' ? `<a href="#" onclick="downloadJob('${job.id}'); return false;" style="color: #28a745; text-decoration: none; margin-left: 10px;">Download</a>` : ''}
                            </td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                container.innerHTML = html;
            }

            document.getElementById('page-info').textContent = `Page ${currentPage} of ${pages} (${total} total)`;
        }
    }

    async function viewJobDetails(jobId) {
        const response = await apiCall(`/jobs/${jobId}`);

        if (response.status === 200) {
            const job = response.data;
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');

            const statusBadge = `<span class="badge badge-${
                job.status === 'completed' ? 'success' :
                job.status === 'processing' ? 'warning' :
                job.status === 'failed' ? 'danger' : 'info'
            }">${job.status}</span>`;

            let html = `
                <h2>${job.job_name}</h2>
                <p style="color: #666;">${job.description || 'No description'}</p>

                <div style="background: #f8f9fa; padding: 15px; border-radius: 4px; margin: 20px 0;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div>
                            <strong>Status:</strong> ${statusBadge}
                        </div>
                        <div>
                            <strong>Files:</strong> ${job.input_file_count}
                        </div>
                        <div>
                            <strong>Contracts:</strong> ${job.total_contracts_extracted}
                        </div>
                        <div>
                            <strong>Services:</strong> ${job.total_services_extracted}
                        </div>
                        <div>
                            <strong>Created:</strong> ${new Date(job.created_at).toLocaleString()}
                        </div>
                        ${job.completed_at ? `<div><strong>Completed:</strong> ${new Date(job.completed_at).toLocaleString()}</div>` : ''}
                        ${job.processing_time_seconds ? `<div><strong>Time:</strong> ${job.processing_time_seconds.toFixed(2)}s</div>` : ''}
                    </div>
                </div>

                ${job.error_message ? `
                    <div style="background: #f8d7da; padding: 15px; border-radius: 4px; color: #721c24; margin: 20px 0;">
                        <strong>Error:</strong> ${job.error_message}
                    </div>
                ` : ''}

                <strong>Uploaded Files:</strong>
                <ul style="margin: 10px 0 20px 20px;">
                    ${job.uploaded_files.map(f => `<li>${f}</li>`).join('')}
                </ul>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button onclick="closeModal()" class="btn btn-secondary">Close</button>
                    ${job.status === 'completed' ? `<button onclick="downloadJob('${job.id}')" class="btn">📥 Download Results</button>` : ''}
                </div>
            `;

            content.innerHTML = html;
            modal.style.display = 'flex';
        }
    }

    async function downloadJob(jobId) {
        try {
            const response = await fetch(`/api/jobs/${jobId}/download`, {
                method: 'GET'
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `extraction_${jobId}.xlsx`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            } else {
                alert('Download failed: ' + response.statusText);
            }
        } catch (error) {
            alert('Error downloading file: ' + error.message);
        }
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    function selectAllJobs() {
        const selectAllCheckbox = document.getElementById('select-all-checkbox');
        const jobCheckboxes = document.querySelectorAll('.job-checkbox');
        jobCheckboxes.forEach(checkbox => {
            checkbox.checked = selectAllCheckbox.checked;
        });
        updateDeleteUI();
    }

    function updateDeleteUI() {
        const jobCheckboxes = document.querySelectorAll('.job-checkbox');
        const selectedCount = Array.from(jobCheckboxes).filter(cb => cb.checked).length;
        const deleteButton = document.getElementById('delete-button');
        const selectionCount = document.getElementById('selection-count');

        selectionCount.textContent = `(${selectedCount} selected)`;
        deleteButton.style.display = selectedCount > 0 ? 'block' : 'none';

        // Update select-all checkbox state
        const selectAllCheckbox = document.getElementById('select-all-checkbox');
        selectAllCheckbox.checked = selectedCount > 0 && selectedCount === jobCheckboxes.length;
    }

    function getSelectedJobIds() {
        const jobCheckboxes = document.querySelectorAll('.job-checkbox:checked');
        return Array.from(jobCheckboxes).map(cb => cb.value);
    }

    async function deleteSelectedJobs() {
        const selectedIds = getSelectedJobIds();
        if (selectedIds.length === 0) {
            alert('Please select at least one job to delete.');
            return;
        }

        const confirmed = confirm(`Delete ${selectedIds.length} job(s)? This cannot be undone.`);
        if (!confirmed) return;

        try {
            const deleteButton = document.getElementById('delete-button');
            deleteButton.disabled = true;
            deleteButton.textContent = '🗑️ Deleting...';

            console.log('[DELETE] Calling DELETE /api/jobs with IDs:', selectedIds);
            const response = await apiCall('/jobs', 'DELETE', { job_ids: selectedIds });
            console.log('[DELETE] Response:', response);

            if (response && response.status === 200) {
                console.log('[DELETE] Success! Deleted count:', response.data.deleted_count);
                showAlert(`Successfully deleted ${response.data.deleted_count} job(s).`, 'success');
                currentPage = 1;
                console.log('[DELETE] Refreshing job list...');
                await loadJobs();
                console.log('[DELETE] Job list refreshed');
                document.getElementById('select-all-checkbox').checked = false;
            } else {
                console.error('[DELETE] Failed with status:', response?.status, response?.data);
                showAlert(`Deletion failed: ${response?.data?.error || 'Unknown error'}`, 'error');
            }
        } catch (error) {
            console.error('[DELETE] Exception:', error);
            showAlert(`Error deleting jobs: ${error.message}`, 'error');
        } finally {
            const deleteButton = document.getElementById('delete-button');
            deleteButton.disabled = false;
            deleteButton.textContent = '🗑️ Delete Selected';
        }
    }

    function showAlert(message, type) {
        const alertContainer = document.getElementById('alert-container') || document.createElement('div');
        if (!alertContainer.id) {
            alertContainer.id = 'alert-container';
            document.querySelector('.card').insertBefore(alertContainer, document.querySelector('.card').firstChild);
        }
        const alert = document.createElement('div');
        alert.className = `alert alert-${type}`;
        alert.textContent = message;
        alertContainer.innerHTML = '';
        alertContainer.appendChild(alert);
        setTimeout(() => alert.remove(), 5000);
    }

    function previousPage() {
        if (currentPage > 1) {
            currentPage--;
            loadJobs();
        }
    }

    function nextPage() {
        currentPage++;
        loadJobs();
    }

    // Search
    document.getElementById('search-box').addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const rows = document.querySelectorAll('table tbody tr');
        rows.forEach(row => {
            const jobName = row.cells[0].textContent.toLowerCase();
            row.style.display = jobName.includes(searchTerm) ? '' : 'none';
        });
    });

    // Load jobs on page load
    window.addEventListener('load', async () => {
        // Verify user is authenticated
        const authCheck = await fetch('/api/user');
        if (!authCheck.ok) {
            window.location.href = '/';
        } else {
            loadJobs();
        }
    });

    // Auto-refresh every 5 seconds
    setInterval(() => {
        if (document.getElementById('modal').style.display === 'none') {
            loadJobs();
        }
    }, 5000);
</script>
{% endblock %}
