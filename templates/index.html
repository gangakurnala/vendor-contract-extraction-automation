{% extends "base.html" %}

{% block title %}Login - Contract Extraction{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto;">
    <div class="card">
        <h1 style="text-align: center; margin-bottom: 30px; color: #667eea;">Welcome to Contract Extraction</h1>

        <div id="alert-container"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required placeholder="Enter your Maersk username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">Login</button>
        </form>

        <div style="text-align: center; margin-top: 20px; color: #666; font-size: 14px;">
            <p>This application uses Maersk authentication.</p>
            <p>Contact your administrator if you need access.</p>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            // Create FormData for login
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            const response = await fetch('/login', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (response.ok) {
                showAlert('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1000);
            } else {
                showAlert(result.error || 'Login failed', 'error');
            }
        } catch (error) {
            showAlert('An error occurred: ' + error.message, 'error');
        }
    });

    function showAlert(message, type) {
        const alertContainer = document.getElementById('alert-container');
        const alert = document.createElement('div');
        alert.className = `alert alert-${type}`;
        alert.textContent = message;
        alertContainer.innerHTML = '';
        alertContainer.appendChild(alert);
    }

    // Check if already logged in
    window.addEventListener('load', async () => {
        const response = await fetch('/api/user');
        if (response.ok) {
            window.location.href = '/dashboard';
        }
    });
</script>
{% endblock %}
