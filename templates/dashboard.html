{% extends "base.html" %}

{% block title %}Dashboard - Contract Extraction{% endblock %}

{% block content %}
<h1>Dashboard</h1>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px;">
    <div class="card" style="padding: 20px; text-align: center;">
        <div style="font-size: 32px; color: #667eea; margin-bottom: 10px;">📊</div>
        <div style="font-size: 24px; font-weight: bold;" id="total-jobs">0</div>
        <div style="color: #666; font-size: 14px;">Total Jobs</div>
    </div>

    <div class="card" style="padding: 20px; text-align: center;">
        <div style="font-size: 32px; color: #28a745; margin-bottom: 10px;">✅</div>
        <div style="font-size: 24px; font-weight: bold;" id="completed-jobs">0</div>
        <div style="color: #666; font-size: 14px;">Completed</div>
    </div>

    <div class="card" style="padding: 20px; text-align: center;">
        <div style="font-size: 32px; color: #ffc107; margin-bottom: 10px;">⏳</div>
        <div style="font-size: 24px; font-weight: bold;" id="processing-jobs">0</div>
        <div style="color: #666; font-size: 14px;">Processing</div>
    </div>

    <div class="card" style="padding: 20px; text-align: center;">
        <div style="font-size: 32px; color: #dc3545; margin-bottom: 10px;">❌</div>
        <div style="font-size: 24px; font-weight: bold;" id="failed-jobs">0</div>
        <div style="color: #666; font-size: 14px;">Failed</div>
    </div>
</div>

<div class="card">
    <h2>Quick Actions</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px;">
        <a href="/upload" class="btn" style="text-align: center; text-decoration: none;">📤 Upload Contract</a>
        <a href="/jobs" class="btn" style="text-align: center; text-decoration: none;">📋 View All Jobs</a>
        <button onclick="loadDashboardData()" class="btn" style="width: 100%;">🔄 Refresh</button>
    </div>
</div>

<div class="card">
    <h2>Recent Jobs</h2>
    <div id="recent-jobs-container">
        <div class="loading" style="display: block;">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
    </div>
</div>

<script>
    async function loadDashboardData() {
        const response = await apiCall('/jobs?page=1&per_page=5');

        if (response.status === 200) {
            const jobs = response.data.jobs;

            // Calculate stats
            let completed = 0, processing = 0, failed = 0;
            jobs.forEach(job => {
                if (job.status === 'completed') completed++;
                else if (job.status === 'processing') processing++;
                else if (job.status === 'failed') failed++;
            });

            document.getElementById('total-jobs').textContent = response.data.total;
            document.getElementById('completed-jobs').textContent = completed;
            document.getElementById('processing-jobs').textContent = processing;
            document.getElementById('failed-jobs').textContent = failed;

            // Display recent jobs
            const container = document.getElementById('recent-jobs-container');
            if (jobs.length === 0) {
                container.innerHTML = '<p style="color: #999;">No jobs yet. <a href="/upload">Upload contracts</a> to get started.</p>';
            } else {
                let html = '<table><thead><tr><th>Job Name</th><th>Status</th><th>Files</th><th>Created</th><th>Action</th></tr></thead><tbody>';
                jobs.forEach(job => {
                    const statusBadge = `<span class="badge badge-${job.status === 'completed' ? 'success' : job.status === 'processing' ? 'warning' : 'danger'}">${job.status}</span>`;
                    const createdDate = new Date(job.created_at).toLocaleDateString();
                    html += `
                        <tr>
                            <td>${job.job_name}</td>
                            <td>${statusBadge}</td>
                            <td>${job.input_file_count}</td>
                            <td>${createdDate}</td>
                            <td><a href="/jobs" style="color: #667eea; text-decoration: none;">View</a></td>
                        </tr>
                    `;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            }
        }
    }

    // Load data on page load
    window.addEventListener('load', async () => {
        // Verify user is authenticated
        const authCheck = await fetch('/api/user');
        if (!authCheck.ok) {
            window.location.href = '/';
        } else {
            loadDashboardData();
        }
    });

    // Auto-refresh every 10 seconds
    setInterval(loadDashboardData, 10000);
</script>
{% endblock %}
