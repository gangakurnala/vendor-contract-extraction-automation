name: Release

on:
  push:
    tags:
      - 'v*'  # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Extract version
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Generate changelog
      id: changelog
      run: |
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %h: %s" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: Release ${{ steps.version.outputs.version }}
        body: |
          ## Changes in this Release

          ${{ steps.changelog.outputs.changelog }}

          ### Installation
          ```bash
          pip install -r requirements.txt
          pip install -r requirements_web.txt
          ```

          ### Usage
          - **Test Mode:** `python contract_extractor_test.py`
          - **Production:** `python contract_extractor.py` (requires `.env` with API key)
          - **Web App:** `python app.py`
        draft: false
        prerelease: false

    - name: Build Docker image
      run: |
        docker build -t vendor-contract-extraction:${{ steps.version.outputs.version }} .
        echo "Docker image ready: vendor-contract-extraction:${{ steps.version.outputs.version }}"

    # TODO: Push Docker image to registry
    # Example for Docker Hub:
    # - name: Login to Docker Hub
    #   uses: docker/login-action@v2
    #   with:
    #     username: ${{ secrets.DOCKERHUB_USERNAME }}
    #     password: ${{ secrets.DOCKERHUB_TOKEN }}
    #
    # - name: Push Docker image
    #   run: |
    #     docker tag vendor-contract-extraction:${{ steps.version.outputs.version }} ${{ secrets.DOCKERHUB_USERNAME }}/vendor-contract-extraction:${{ steps.version.outputs.version }}
    #     docker push ${{ secrets.DOCKERHUB_USERNAME }}/vendor-contract-extraction:${{ steps.version.outputs.version }}

    - name: Release notification
      run: |
        echo "✅ Release ${{ steps.version.outputs.version }} created successfully!"
