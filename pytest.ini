[pytest]
# Pytest configuration for vendor contract extraction tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for full pipeline
    extraction: Tests for contract extraction
    excel: Tests for Excel generation
    models: Tests for data models
    slow: Tests that take longer to run
